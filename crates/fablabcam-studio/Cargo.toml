[package]
name = "fablabcam-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fablabcam-geom = { path = "../fablabcam-geom" }
fablabcam-model = { path = "../fablabcam-model" }
fablabcam-cam = { path = "../fablabcam-cam" }
fablabcam-backplot = { path = "../fablabcam-backplot" }
roxmltree = "0.19"
# SVG grammar (exponents, implicit commands and affine transform lists).
svgtypes = "=0.16.2"
# Scripts d'automatisation ; conserver les correctifs du moteur dans Cargo.lock.
rhai = "1.27.0"
# Lecture des contours de lettres (texte).
ttf-parser = { version = "=0.20.0", default-features = false, features = ["std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27.0"
zip = { version = "9.3.0", default-features = false }
pdf-writer = "0.15.0"
genai = { version = "=0.7.3", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures-util = "0.3"
schemars = "1.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
dotenvy = "0.15.7"
