name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'profiles/**'
      - 'about.toml'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_STRIP: symbols
  FABLABCAM_BUILD_ID: ${{ github.sha }}

jobs:
  notices:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: License tool
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Collect licenses and corresponding sources
        run: python3 packaging/notices.py target/notices
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: target/notices
          if-no-files-found: error

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: notices
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: macos, arch: arm64, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, platform: macos, arch: x64, target: x86_64-apple-darwin}
          - {runner: windows-2025, platform: windows, arch: x64, target: x86_64-pc-windows-msvc, rustflags: '-C target-feature=+crt-static'}
          - {runner: windows-11-arm, platform: windows, arch: arm64, target: aarch64-pc-windows-msvc, rustflags: '-C target-feature=+crt-static'}
          - {runner: ubuntu-22.04, platform: linux, arch: x64, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-22.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev fonts-dejavu-core
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --version=3.11 --no-progress --yes
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add ${{ matrix.target }}
      - name: Tests on the target architecture
        run: cargo test --locked --workspace --target ${{ matrix.target }} --no-fail-fast
      - name: Release binaries
        run: cargo build --locked --release --workspace --target ${{ matrix.target }}
      - name: CLI smoke test
        run: |
          target/${{ matrix.target }}/release/fablabcam version
          target/${{ matrix.target }}/release/fablabcam machine help
          target/${{ matrix.target }}/release/fablabcam machine validate crates/fablabcam-cam/tests/fixtures/machine-valid.nc --profile profiles/mach3-mill-demo.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: target/notices
      - name: Native installers and portable archives
        run: python packaging/package.py --target ${{ matrix.target }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Verify Debian installation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/release/*.deb
          /usr/bin/fablabcam help
      - name: Verify Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/release/*-Setup.exe).FullName
          $testDir = Join-Path $env:RUNNER_TEMP 'FabLabCAM-install'
          $process = Start-Process $installer -ArgumentList '/S',"/D=$testDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          & "$testDir/fablabcam.exe" help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
      - name: Checksums
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('dist/release')
          (p / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}\n' for f in sorted(p.iterdir()) if f.is_file()))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FabLabCAM-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
